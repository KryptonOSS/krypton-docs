<div id="main" role="main">
  <div class="archive">
    {% if page.toc == "true" %}
    <div class="archive-with-toc">
      <aside class="toc-sidebar">{% toc %}</aside>
      <div class="archive-content">
        <h1 class="page__title">{{ page.title }}</h1>
        {{ content }}
      </div>
    </div>
    {% else %}
    <h1 class="page__title">{{ page.title }}</h1>
    {{ content }}
    {% endif %}
  </div>
</div>
